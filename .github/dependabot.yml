version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # One PR for all Actions bumps: separate PRs touching adjacent
    # workflow lines conflict with each other as soon as one merges.
    groups:
      github-actions:
        patterns: ["*"]
